blurb = """
Japanese looks impossible from the outside: three writing systems, verbs at the
end of every sentence and a politeness system that changes with whoever is in
the room. From the inside it is logical, playful and deeply rewarding.

This book starts with hiragana and builds steadily: kanji, grammar, core
vocabulary and the full range of politeness, then the Japanese people actually
speak, with its dialects, slang and anime voices. It takes you into the culture
behind the words, from trains and konbini to festivals, baseball and Vtubers,
and ends with paths for anime and manga fans, news readers, business
professionals and every level of the JLPT.

Every chapter ends with graded practice, with answers at the back of the book.
